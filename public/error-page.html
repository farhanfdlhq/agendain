<!doctype html>
<!--
  Halaman error statis Agendain — disajikan NGINX (bukan Next.js) saat aplikasi
  Node gagal merespons: selama deploy (`.next` dihapus lalu dibangun ulang), PM2
  mati, atau error yang tidak bisa dirender Next. Sengaja mandiri: CSS inline,
  logo base64, tanpa JS/font eksternal — harus tampil walau aplikasi mati total.
  Konfigurasi nginx: scripts/nginx-error-page.conf. Saat deploy, logo & favicon
  di file ini diganti dengan yang terpasang di Pengaturan (scripts/build-error-page.ts).
-->

<style>
  :root { --navy: #054569; --navy-deep: #032f48; --gold: #FFC704; --gold-hover: #e6b300; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100%;
    display: flex; flex-direction: column;
    background: var(--navy-deep);
    background-image: radial-gradient(120% 80% at 50% 0%, var(--navy) 0%, var(--navy-deep) 70%);
    color: #fff;
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header { padding: 28px 24px 0; display: flex; justify-content: center; }
  header img { height: 34px; width: auto; }
  main {
    flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 48px 24px 64px; max-width: 560px; margin: 0 auto;
  }
  .rule { width: 56px; height: 3px; border-radius: 9999px; background: var(--gold); margin-bottom: 28px; }
  h1 { font-size: clamp(2rem, 6vw, 2.75rem); line-height: 1.12; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--gold); }
  p.lead { margin-top: 16px; font-size: 1.0625rem; line-height: 1.6; color: rgba(255,255,255,.82); text-wrap: balance; }
  .actions { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 0 26px; border-radius: 9999px;
    font: inherit; font-weight: 700; font-size: 1rem; text-decoration: none; cursor: pointer;
    transition: background-color .15s, color .15s, border-color .15s;
  }
  .btn-primary { background: var(--gold); color: var(--navy-deep); border: 0; }
  .btn-primary:hover { background: var(--gold-hover); }
  .btn-ghost { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.35); }
  .btn-ghost:hover { border-color: #fff; }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .retry { margin-top: 20px; font-size: .875rem; color: rgba(255,255,255,.6); min-height: 1.5em; }
  .retry b { color: #fff; font-variant-numeric: tabular-nums; }
  .en { margin-top: 40px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.12); font-size: .875rem; line-height: 1.5; color: rgba(255,255,255,.55); }
  footer { padding: 0 24px 24px; text-align: center; font-size: .75rem; color: rgba(255,255,255,.4); }
