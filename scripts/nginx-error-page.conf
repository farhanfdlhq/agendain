# Halaman error bermerek untuk agendain.com (nginx aaPanel).
#
# Tanpa ini, saat aplikasi Node gagal merespons — terutama SELAMA DEPLOY, karena
# deploy.sh menghapus `.next` lalu build ulang sementara proses PM2 lama masih
# jalan — pengunjung melihat teks polos "Internal Server Error" (500) atau
# halaman 502/504 bawaan nginx.
#
# CARA PASANG (sekali, manual di aaPanel):
#   Website → agendain.com → Config (file konfigurasi situs). Tempel blok di bawah
#   ke dalam `server { ... }`, SEBELUM `location /` yang mem-proxy ke 127.0.0.1:3005.
#   Lalu tambahkan `proxy_intercept_errors on;` dan `proxy_cache off;` di dalam
#   `location /` tersebut.
#   Simpan → aaPanel menjalankan `nginx -t` + reload.
#
# Catatan:
# - 502/504 (aplikasi mati) dibuat nginx sendiri, jadi `error_page` saja cukup.
#   500 dari Next.js perlu `proxy_intercept_errors on` agar ikut diganti.
# - /api/* SENGAJA tidak di-intercept: dashboard admin mengharapkan JSON error,
#   bukan HTML. Blok `location /api/` di bawah menyalin proxy tanpa intercept —
#   samakan isinya dengan `location /` milik aaPanel (proxy_pass, header, timeout,
#   dsb.) bila di sana ada baris lain yang tidak tercantum di sini.
# - `=503`: Cloudflare MENGGANTI balasan 502/504 dari origin dengan halaman
#   "Bad gateway" miliknya, jadi halaman ini tak pernah sampai. 500/503 diteruskan
#   apa adanya → semua error disajikan sebagai 503 (+ Retry-After), status yang
#   juga tepat untuk "sedang maintenance" dan aman untuk SEO.
# - Halaman error Next (app/error.tsx) yang berstatus 500 juga ikut diganti
#   halaman statis ini; itu disengaja (tampilannya sama-sama bermerek).
# - `proxy_cache off`: proxy cache nginx aktif untuk situs ini (header X-Cache:
#   HIT/EXPIRED; cache_one dari setelan proxy aaPanel). Untuk app Next.js itu
#   berbahaya: saat aplikasi mati nginx menyajikan salinan HTML BASI (status 200,
#   jadi error_page tak terpicu; CSS-nya build lama → halaman polos tanpa gaya),
#   dan HTML halaman login/admin bisa ikut tersimpan.
#   Next sudah mengatur cache sendiri; aset statis di-cache Cloudflare.
# - Bila aaPanel membuat ulang config (mis. mengubah setelan Node Project),
#   cek lagi bahwa blok ini masih ada.

error_page 500 502 503 504 =503 /__agendain_error.html;

location = /__agendain_error.html {
    alias /www/wwwroot/agendain/public/error-page.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "30" always;
    internal;
}

location /api/ {
    proxy_pass http://127.0.0.1:3005;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;
    add_header X-Cache $upstream_cache_status;

    proxy_connect_timeout 30s;
    proxy_read_timeout 86400s;
    proxy_send_timeout 30s;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_intercept_errors off;
    proxy_cache off;
}
