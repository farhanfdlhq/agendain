# Kunci agendain.com agar HANYA melayani permintaan yang datang lewat Cloudflare
# (nginx aaPanel). Daftar IP diambil 23 Nov 2026.
#
# KENAPA
# - IP VPS memang publik: mail.agendain.com & webmail.agendain.com (DNS only)
#   mengarah langsung ke VPS, dan PTR IP-nya = mail.agendain.com. Jadi IP tidak
#   bisa disembunyikan; yang bisa dilakukan adalah menolak akses langsung.
# - Uji 23 Nov 2026: `curl --resolve agendain.com:443:<IP-VPS>` → 200 dari nginx.
#   Artinya WAF/aturan Cloudflare (dan Cloudflare Access /admin nanti) bisa
#   dilewati, dan header `cf-connecting-ip` bisa dipalsukan sehingga batas login
#   per-IP (lib/security.ts getClientIpFromHeaders) bisa diakali.
# - Port aplikasi (3005, 3010, 3100, 3200, 3300) sudah tertutup dari luar
#   (firewall sistem), jadi cukup nginx yang dikunci.
#
# KENAPA BUKAN FIREWALL SERVER
# Firewall VPS (aaPanel Security / Hostinger) yang membatasi port 80/443 ke IP
# Cloudflare akan mematikan webmail.agendain.com dan situs lain di VPS yang sama
# yang tidak lewat Cloudflare. Blok ini hanya berlaku untuk situs agendain.com.
#
# CARA PASANG (sekali, manual di aaPanel)
#   Website → agendain.com → Config. Tempel BAGIAN A di paling atas file (di LUAR
#   `server { }`), BAGIAN B di dalam `server { }` tepat setelah baris
#   `server_name`. Bila ada lebih dari satu `server { }` untuk agendain.com,
#   BAGIAN B ditempel di tiap blok. Simpan → aaPanel menjalankan `nginx -t` +
#   reload; bila gagal, aaPanel menolak menyimpan dan situs tetap seperti semula.
#
# Catatan:
# - `$realip_remote_addr` = IP yang benar-benar terhubung ke nginx (IP Cloudflare),
#   juga bila nanti modul real_ip diaktifkan. Butuh modul http_realip (cek:
#   `/www/server/nginx/sbin/nginx -V 2>&1 | grep -o http_realip_module`). Bila
#   modul itu tidak ada, ganti `$realip_remote_addr` dengan `$remote_addr`.
# - 127.0.0.1 / ::1 diizinkan untuk permintaan dari server itu sendiri.
# - /.well-known/acme-challenge/ dikecualikan agar perpanjangan SSL Let's Encrypt
#   tidak pernah terblokir.
# - `return 444` = nginx menutup koneksi tanpa balasan (pemindai tidak dapat apa-apa).
# - JANGAN ubah record agendain.com / www di Cloudflare menjadi "DNS only" (awan
#   abu-abu): semua pengunjung akan tertolak. Bila suatu saat perlu, hapus BAGIAN B dulu.
# - Bila aaPanel membuat ulang config (mis. mengubah setelan Node Project / SSL),
#   cek lagi bahwa kedua bagian masih ada.
# - Cloudflare jarang mengubah daftar IP; cocokkan ulang dengan
#   https://www.cloudflare.com/ips-v4 dan /ips-v6 tiap beberapa bulan.

# ===== BAGIAN A — paling atas file config, DI LUAR `server { }` =====
geo $realip_remote_addr $agendain_via_cf {
    default 0;

    # Server ini sendiri
    127.0.0.1/32 1;
    ::1/128 1;

    # Cloudflare IPv4
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;

    # Cloudflare IPv6
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# ===== BAGIAN B — di DALAM `server { }`, tepat setelah baris server_name =====
    set $agendain_tolak 0;
    if ($agendain_via_cf = 0) { set $agendain_tolak 1; }
    if ($request_uri ~ "^/\.well-known/acme-challenge/") { set $agendain_tolak 0; }
    if ($agendain_tolak = 1) { return 444; }
